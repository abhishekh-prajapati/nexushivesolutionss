    <style>
        :root {
            --bg-page: #f1f5f9;          /* Whitish Grey Background */
            --card-shadow: 0 16px 36px -8px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.05);
            --gold: #C5A880;
            --gold-dark: #8c6a38;
            --navy: #0F2C59;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        .cards-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Top Brand Navigation Bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 4px 6px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            transition: opacity 0.2s ease;
        }

        .brand-link:hover {
            opacity: 0.8;
        }

        .brand-link img {
            height: 32px;
            width: auto;
        }

        .top-btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--navy);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .action-chip:hover {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 44, 89, 0.2);
        }

        /* Static Card Stack Item */
        .card-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1.75 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: var(--card-shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-item:hover {
            box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(197, 168, 128, 0.4);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* Direct Clickable Hotspots Layer */
        .hotspots-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .hotspot {
            position: absolute;
            text-decoration: none;
            cursor: pointer;
            display: block;
            background: transparent;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hotspot:hover, .hotspot:focus, .hotspot:active {
            background-color: transparent;
            box-shadow: none;
            outline: none;
            border: none;
        }

        /* FRONT HOTSPOTS */
        /* Logo & Branding */
        .hs-front-logo {
            left: 2%;
            top: 5%;
            width: 53%;
            height: 90%;
            border-radius: 14px;
        }

        /* Adv. Jaya Bhavya Name & Title -> Founder Section */
        .hs-front-name {
            left: 58%;
            top: 16%;
            width: 40%;
            height: 48%;
        }

        /* Phone */
        .hs-front-phone {

            width: 40%;
            height: 9%;
        }

        /* Website */

            height: 9%;
        }

        /* Email */
        .hs-front-email {
            left: 58%;
            top: 84%;
            width: 40%;
            height: 10%;
        }

        /* BACK HOTSPOTS (6 Service Verticals) */
        /* Header -> Services */
        .hs-back-header {
            left: 5%;
            top: 4%;
            width: 90%;
            height: 12%;
        }

        /* 1. Business Setup & Compliance */
        .hs-back-service-1 {
            left: 8%;
            top: 20%;
            width: 40%;
            height: 20%;
        }

        /* 2. HR Strategy */
        .hs-back-service-2 {
            left: 8%;
            top: 41%;
            width: 40%;
            height: 20%;
        }

        /* 3. POSH & Training */
        .hs-back-service-3 {
            left: 8%;
            top: 62%;
            width: 40%;
            height: 20%;
        }

        /* 4. Tech & Digital */
        .hs-back-service-4 {
            left: 52%;
            top: 20%;
            width: 40%;
            height: 20%;
        }

        /* 5. Finance & Marketing */
        .hs-back-service-5 {
            left: 52%;
            top: 41%;
            width: 40%;
            height: 20%;
        }

        /* 6. Corporate Events */
        .hs-back-service-6 {
            left: 52%;
            top: 62%;
            width: 40%;
            height: 20%;
        }

        /* Bottom banner */
        .hs-back-bottom {
            left: 0;
            top: 83%;
            width: 100%;
            height: 17%;
            border-radius: 0 0 18px 18px;
        }

        /* Bottom Action Bar */
        .bottom-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
        }

        .action-pill {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--navy);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
            transition: all 0.2s ease;
        }

        .action-pill:hover {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 44, 89, 0.2);
        }

        .action-pill.primary {
            background: linear-gradient(135deg, #0F2C59, #1e3a8a);
            color: #ffffff;
            border-color: transparent;
        }

        .action-pill.primary:hover {
            background: linear-gradient(135deg, #1e40af, #0F2C59);
        }

        .action-pill.whatsapp {
            background: #25D366;
            color: #ffffff;
            border-color: #22c55e;
        }

        .action-pill.whatsapp:hover {
            background: #16a34a;
            border-color: #16a34a;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 22px;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .cards-container {
                gap: 16px;
            }

                font-size: 0.82rem;

        }

<body>

    <div class="cards-container">

        <!-- CARD 2: BACK SIDE (6 Core Service Verticals) -->
        <div class="card-item" id="cardBack">
            <img src="img/card_back.png" class="card-img" alt="NexusHive 6 Core Service Verticals">
            <div class="hotspots-layer">
                <!-- Header -> Services -->
                <a href="services.html" class="hotspot hs-back-header"></a>

                <!-- 1. Business Setup & Compliance -->

        <!-- Bottom Quick Actions -->

            <button class="action-pill primary" onclick="downloadVCard()">

            <a href="https://wa.me/919901444663?text=Hi%20Adv.%20Jaya%20Bhavya,%20I%20reached%20out%20via%20your%20NexusHive%20digital%20card." target="_blank" class="action-pill whatsapp">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Link Copied!</span>
    </div>

    <script>
        // Generate and Download vCard (.vcf)
        function downloadVCard() {
            const vCardData = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Bhavya;Jaya;Adv.;;',
                'FN:Adv. Jaya Bhavya',
                'ORG:NexusHive Solutions LLP',
                'TITLE:Founder & Managing Director',
                'TEL;TYPE=WORK,VOICE:+919901444663',
                'TEL;TYPE=CELL,VOICE:+919901444663',
                'EMAIL;TYPE=PREF,INTERNET:jayabhavya@nexushivesolutions.com',
                'URL:https://nexushivesolutions.com',
                'ADR;TYPE=WORK:;;No 11 & 12 Ganesh Nagar Layout, Telecom Road, Virupakshapura;Bangalore;Karnataka;560097;India',
                'NOTE:Adv. Jaya Bhavya - Founder & Managing Director, NexusHive Solutions LLP. Your One-Stop Business Partner.',
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Adv_Jaya_Bhavya_NexusHive.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Contact (.vcf) downloaded!');
        }

        // Share Card via Web Share API or Copy Link
        async function shareCard() {
            const shareData = {
                title: 'Adv. Jaya Bhavya — Digital Card | NexusHive Solutions',
                text: 'Digital Visiting Card for Adv. Jaya Bhavya, Founder & Managing Director at NexusHive Solutions LLP.',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        copyLink();
                    }
                }
            } else {
                copyLink();
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('Card link copied to clipboard!');
            }).catch(() => {
                showToast('Link copied!');
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
